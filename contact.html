    <div class="contact-wrapper">
        <div class="contact1">
            <h2>お問い合わせフォーム</h2>
            <form action="#">
                <dl class="form-area">
                    <dt><span class="required"> お名前</span></dt>
                    <dd><input type="text" class="input-text" name="name" placeholder="ここに名前を入力" required></dd>
                    <dt><span class="required"> メールアドレス</span></dt>
                    <dd><input type="email" class="input-text" name="email"  placeholder="アドレスを入力" required></dd>
                    <dt>お電話番号</dt>
                    <dd><input type="tel" class="input-text" name="tel" placeholder="例080444444"></dd>
                    <dt>お問い合わせ種別</dt>
                    <dd>
                        <select class="select-box" name="genre">
                            <option value="ご予約について" selected>ご予約について</option>
                            <option value="メニューについて">メニューについて</option>
                            <option value="営業時間について">営業時間について</option>
                        </select>
                    </dd>
                    <dt>お客様について</dt>
                    <dd>
                        <label class="radio-button"><input type="radio" name="user-type" value="一般のお客様"
                                checked>一般のお客様</label>
                        <label class="radio-button"><input type="radio" name="user-type" value="お取引先様">お取引先様</label>
                        <label class="radio-button"><input type="radio" name="user-type" value="その他">その他</label>
                    </dd>
                    <dt><span class="required"> お問い合わせ内容</span></dt>
                    <dd>
                        <textarea name="message" class="message" placeholder="文章入力欄" required></textarea>
                    </dd>
                </dl>
                <p class="confirm-text">ご入力内容をご確認の上、お間違いがなければ［Submit］ボタンを押してください。</p>
                <button class="submit-button">Submit</button>
            </form>
        </div>

<script>

    const title = document.querySelector(".title");
    const text = title.textContent;

    title.textContent = "";

    text.split("").forEach((mozi, i) => {
        const span = document.createElement("span");
        span.textContent = mozi;
        span.style.animationDelay = i * 0.2 + "s";
        title.appendChild(span);
    });

    const target = document.querySelector(".under_top");

    document.addEventListener("scroll", function () {

        const distance = target.getBoundingClientRect().top + ozi.clientHeight * 0.6;
        if (window.innerHeight > distance) {
            ozi.classList.add("show");
        }

    });


    const ft = document.querySelector("footer");

    window.addEventListener("scroll", function () {

        const sp = window.scrollY + window.innerHeight;
        const pageh = document.documentElement.scrollHeight;

        if (sp >= pageh) {
            ft.classList.add("foot");
        } else {
            ft.classList.remove("foot")
        }

    });

</script>
