<script>


    const vides = document.querySelectorAll(".hover-video");

    vides.forEach((vide) => {
        const video = vide.querySelector("video");

        vide.addEventListener('mouseenter', () => {
            video.play();
        });

        vide.addEventListener('mouseleave', () => {
            video.pause();
            video.currentTime = 0;
        });
    });



    const title = document.querySelector(".title");
    const text = title.textContent;

    title.textContent = "";

    text.split("").forEach((mozi, i) => {
        const span = document.createElement("span");
        span.textContent = mozi;
        span.style.animationDelay = i * 0.2 + "s";
        title.appendChild(span);
    });


    const ft = document.querySelector("footer");

    window.addEventListener("scroll", function () {

        const sp = window.scrollY + window.innerHeight;
        const pageh = document.documentElement.scrollHeight;

        if (sp >= pageh) {
            ft.classList.add("foot");
        } else {
            ft.classList.remove("foot")
        }

    });

</script>
