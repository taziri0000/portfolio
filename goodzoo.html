<script>


    document.addEventListener('DOMContentLoaded', () => {
        const mainImg = document.getElementById('main-image');
        const container = document.getElementById('zoom-container');
        const result = document.getElementById('zoom-result');
        const allThumbs = document.querySelectorAll('.roope-inner img');
        const title = document.querySelector(".title");
        const ft = document.querySelector("footer");

        const slides = document.querySelector(".slides");
        const slide = document.querySelectorAll(".slide");
        const prev = document.querySelector(".prev");
        const next = document.querySelector(".next");
        const dotsContainer = document.querySelector(".dots");

        if (mainImg && container && result) {
            allThumbs.forEach(thumb => {
                thumb.addEventListener('click', () => {
                    mainImg.src = thumb.src;
                    mainImg.style.opacity = 0;
                    setTimeout(() => { mainImg.style.opacity = 1; }, 50);
                });
            });

            container.addEventListener('mousemove', (e) => {
                result.style.display = 'block';
                const rect = container.getBoundingClientRect();
                const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
                const yPercent = ((e.clientY - rect.top) / rect.height) * 100;
                result.style.backgroundImage = `url('${mainImg.src}')`;
                result.style.backgroundSize = `${rect.width * 3}px ${rect.height * 3}px`;
                result.style.backgroundPosition = `${xPercent}% ${yPercent}%`;
            });

            container.addEventListener('mouseleave', () => {
                result.style.display = 'none';
            });
        }

        if (title) {
            const text = title.textContent;
            title.textContent = "";
            text.split("").forEach((mozi, i) => {
                const span = document.createElement("span");
                span.textContent = mozi;
                span.style.animationDelay = i * 0.2 + "s";
                title.appendChild(span);
            });
        }

        if (slides && slide.length > 0) {
            let index = 0;
            slide.forEach((_, i) => {
                const dot = document.createElement("span");
                dot.classList.add("dot");
                if (i === 0) dot.classList.add("active");
                dot.addEventListener("click", () => { index = i; updateSlider(); });
                dotsContainer.appendChild(dot);
            });
            const dots = document.querySelectorAll(".dot");
            function updateSlider() {
                slides.style.transform = `translateX(-${index * 100}%)`;
                dots.forEach((d, i) => d.classList.toggle("active", i === index));
            }
            if (next) next.addEventListener("click", () => { index = (index + 1) % slide.length; updateSlider(); });
            if (prev) prev.addEventListener("click", () => { index = (index - 1 + slide.length) % slide.length; updateSlider(); });
            setInterval(() => { index = (index + 1) % slide.length; updateSlider(); }, 4000);
        }

        window.addEventListener('scroll', () => {
            if (ft) {
                const isBottom = (window.scrollY + window.innerHeight) >= document.documentElement.scrollHeight - 100;
                if (isBottom) {
                    ft.classList.add("foot");
                } else {
                    ft.classList.remove("foot");
                }
            }
        });
    });








</script>
